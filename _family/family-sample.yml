# Family tree data (placeholder people).
#
# Copy this file to _family/family-private.yml, replace with real people,
# then run:  ruby _family/encrypt.rb
# family-private.yml is gitignored - only the encrypted output is committed.
#
# Fields:
#   id          unique short id, used in parents/spouses
#   name        display name
#   gender      M or F
#   maiden_name surname before marriage (optional), shown as "z d. Nowak"
#   born        date (optional): 1952, 1952-03 or 1952-03-14; if uncertain put
#               ok. / przed / po in front (born: ok. 1890), or "?" in quotes if unknown
#   died        date (optional, same formats; leave out for living people)
#   parents     list of ids (optional)
#   spouses     list (optional, only needs to be listed on one side). Each entry is
#               an id, or an id with the marriage date:  - { id: anna, married: 1950-06-12 }
#
# Optional details, shown when someone taps the person's card:
#   birthplace, deathplace, buried, occupation   text
#   lived       list of places
#   notes       free text; use  notes: |  for several lines
#
# Children and siblings are worked out from parents, so they don't need to be listed.

